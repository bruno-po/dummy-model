[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dummy_model"
version = "0.0.1"
description = "Dummy model com melhores pr\u00e1ticas de DS e MLOps"
authors = [
  { name = "Bruno Pinheiro de Oliveira" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"
dependencies = [
    "duckdb>=1.3.2",
    "hydra-core>=1.3.2",
    "hydra-zen>=0.15.0",
    "kagglehub>=0.3.12",
    "logfire>=3.24.2",
    "numpy>=2.3.1",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "scikit-learn>=1.7.0",
]


[tool.ruff]
line-length = 99
src = ["dummy_model"]
include = ["pyproject.toml", "dummy_model/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["dummy_model"]
force-sort-within-sections = true

[tool.uv.sources]
dummy-model = { workspace = true }

[dependency-groups]
dev = [
    "dummy-model",
    "loguru>=0.7.3",
    "mkdocs>=1.6.1",
    "pip>=25.1.1",
    "python-dotenv>=1.1.1",
    "ruff>=0.12.2",
    "tqdm>=4.67.1",
    "typer>=0.16.0",
]

